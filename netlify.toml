[build]
  publish = "dist"
  command = "bun run build"

# --- 301: consolidate duplicate Metrotown pages ---
[[redirects]]
  from = "/metrotown-burnaby-strata-commercial-snow-removal"
  to = "/metrotown-snow-removal/"
  status = 301
  force = true

[[redirects]]
  from = "/metrotown-burnaby-strata-commercial-snow-removal/*"
  to = "/metrotown-snow-removal/"
  status = 301
  force = true

[[redirects]]
  from = "/metrotown-strata-snow-removal"
  to = "/metrotown-snow-removal/"
  status = 301
  force = true

[[redirects]]
  from = "/metrotown-strata-snow-removal/*"
  to = "/metrotown-snow-removal/"
  status = 301
  force = true

[[redirects]]
  from = "/metrotown-snow-removal-company"
  to = "/metrotown-snow-removal/"
  status = 301
  force = true

[[redirects]]
  from = "/metrotown-snow-removal-company/*"
  to = "/metrotown-snow-removal/"
  status = 301
  force = true

# --- 301: typo fix ---
[[redirects]]
  from = "/now-removal-arbutus"
  to = "/snow-removal-in-arbutus/"
  status = 301
  force = true

# --- SPA fallback (kept in sync with public/_redirects) ---
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
