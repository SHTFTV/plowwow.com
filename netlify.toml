[build]
  publish = "dist"
  command = "bun run build"

# Netlify's pretty-URL handling already serves /foo/index.html at /foo, but the
# explicit 301s below force non-canonical variants (missing trailing slash,
# legacy slug spellings, uppercase paths) to the single canonical URL so the
# canonical <link> tag, sitemap, and Netlify agree on one URL per page.

# --- 301: enforce trailing slash on city + blog patterns ---
[[redirects]]
  from = "/snow-removal-in-:slug"
  to = "/snow-removal-in-:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/:slug-snow-removal"
  to = "/:slug-snow-removal/"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/locations"
  to = "/locations/"
  status = 301
  force = true

[[redirects]]
  from = "/quote"
  to = "/quote/"
  status = 301
  force = true

# --- 301: legacy slug normalization ---
# Older external links used /blog/<slug> before we flattened blog URLs to the
# root. Keep those working with a permanent redirect to the canonical path.
[[redirects]]
  from = "/blog/:slug"
  to = "/:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/:slug/"
  to = "/:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/posts/:slug"
  to = "/:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/posts/:slug/"
  to = "/:slug/"
  status = 301
  force = true



# --- 301: consolidate duplicate Metrotown pages ---
[[redirects]]
  from = "/metrotown-burnaby-strata-commercial-snow-removal"
  to = "/metrotown-snow-removal/"
  status = 301
  force = true

[[redirects]]
  from = "/metrotown-burnaby-strata-commercial-snow-removal/*"
  to = "/metrotown-snow-removal/"
  status = 301
  force = true

[[redirects]]
  from = "/metrotown-strata-snow-removal"
  to = "/metrotown-snow-removal/"
  status = 301
  force = true

[[redirects]]
  from = "/metrotown-strata-snow-removal/*"
  to = "/metrotown-snow-removal/"
  status = 301
  force = true

[[redirects]]
  from = "/metrotown-snow-removal-company"
  to = "/metrotown-snow-removal/"
  status = 301
  force = true

[[redirects]]
  from = "/metrotown-snow-removal-company/*"
  to = "/metrotown-snow-removal/"
  status = 301
  force = true

# --- 301: typo fix ---
[[redirects]]
  from = "/now-removal-arbutus"
  to = "/snow-removal-in-arbutus/"
  status = 301
  force = true

# --- Real 404 for missing /city/* and /blog/* paths ---
# Prevents SPA fallback from serving homepage <title>/<meta> for URLs that
# aren't prerendered. `force = false` lets real files (if any exist under
# dist/city/ or dist/blog/) win; otherwise Netlify serves dist/404.html
# with an HTTP 404 status.
[[redirects]]
  from = "/city/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/blog/*"
  to = "/404.html"
  status = 404

# --- SPA fallback (kept in sync with public/_redirects) ---
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

