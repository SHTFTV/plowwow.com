  status = 301
  force = true

[[redirects]]
  from = "/metrotown-strata-snow-removal"
  to = "/metrotown-snow-removal/"
  status = 301
  force = true

[[redirects]]
  from = "/metrotown-strata-snow-removal/*"
  to = "/metrotown-snow-removal/"
  status = 301
  force = true

[[redirects]]
  from = "/metrotown-snow-removal-company"
