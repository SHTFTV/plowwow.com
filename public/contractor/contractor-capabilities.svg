<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><title>Winter support crews and equipment</title><rect width="1200" height="630" fill="#102339"/><text x="60" y="85" fill="#6be0d4" font-family="Arial" font-size="21">PLOWWOW · WINTER CONTRACTOR APPLICATIONS</text><text x="60" y="155" fill="white" font-family="Arial" font-size="43" font-weight="700">Bring your crew. Tell us what is available.</text><rect x="60" y="220" width="530" height="128" rx="15" fill="#1b3953"/><text x="85" y="269" fill="white" font-family="Arial" font-size="27" font-weight="700">Walkway crews</text><text x="85" y="314" fill="#ccd8e7" font-family="Arial" font-size="22">Shovels · blowers · walkway salters</text><rect x="615" y="220" width="530" height="128" rx="15" fill="#1b3953"/><text x="640" y="269" fill="white" font-family="Arial" font-size="27" font-weight="700">Brine &amp; salting trucks</text><text x="640" y="314" fill="#ccd8e7" font-family="Arial" font-size="22">Liquid systems · granular spreaders</text><rect x="60" y="370" width="530" height="128" rx="15" fill="#1b3953"/><text x="85" y="419" fill="white" font-family="Arial" font-size="27" font-weight="700">Loaders &amp; skid steers</text><text x="85" y="464" fill="#ccd8e7" font-family="Arial" font-size="22">Pushers · buckets · site clearing</text><rect x="615" y="370" width="530" height="128" rx="15" fill="#1b3953"/><text x="640" y="419" fill="white" font-family="Arial" font-size="27" font-weight="700">Snow-hauling trucks</text><text x="640" y="464" fill="#ccd8e7" font-family="Arial" font-size="22">Dump trucks · relocation support</text><text x="60" y="572" fill="#ccd8e7" font-family="Arial" font-size="20">Equipment · operators · availability · insurance · WorkSafe status</text></svg>