name: SEO Regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seo:
    name: SEO Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun global store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock', 'bun.lockb') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Regenerate sitemap (parity check with routes.ts)
        run: bunx tsx scripts/generate-sitemap.ts

      - name: Fail if sitemap.xml would change (drift from routes.ts)
        run: |
          if ! git diff --quiet -- public/sitemap.xml; then
            echo "::error::public/sitemap.xml is out of sync with scripts/routes.ts"
            git --no-pager diff -- public/sitemap.xml | head -80
            exit 1
          fi

      - name: Download previous SEO report (baseline for diff)
        id: baseline
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: seo.yml
          workflow_conclusion: success
          name: seo-report
          path: seo-baseline/
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Generate per-route SEO report (with diff vs. baseline)
        id: report
        env:
          SEO_REPORT_BASELINE: seo-baseline/seo-report.json
          SEO_STRUCTURED_ALLOWLIST: seo-baseline-allow.json
          SEO_FAIL_ON_STRUCTURED_DIFF: "1"
        run: bunx tsx scripts/seo-report.ts
        continue-on-error: true

      - name: Run SEO regression suite
        id: tests
        run: |
          bunx vitest run \
            src/test/seo.regression.test.tsx \
            src/test/sitemap-robots.diff.test.ts \
            src/test/jsonld.schema.test.tsx \
            src/test/seo-score.test.tsx \
            src/test/meta.exact.test.tsx \
            src/test/og-image.reachable.test.ts \
            --reporter=verbose \
            --reporter=json --outputFile=seo-report/vitest-results.json
        continue-on-error: true

      - name: Stage sitemap + robots for artifact
        if: always()
        run: |
          mkdir -p seo-report
          cp public/sitemap.xml seo-report/sitemap.xml || true
          cp public/robots.txt seo-report/robots.txt || true

      - name: Upload SEO artifacts (sitemap, robots, per-route report, vitest results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: seo-report/
          retention-days: 14

      - name: Surface unapproved structured-data (LocalBusiness/FAQPage) changes
        if: always()
        run: |
          if [ -f seo-report/seo-diff-violations.json ]; then
            count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('seo-report/seo-diff-violations.json','utf8')).violationCount ?? 0)")
            if [ "$count" != "0" ]; then
              echo "::error::$count unapproved LocalBusiness/FAQPage change(s) — inspect seo-report/seo-diff-violations.json and seo-report/structured-data-snapshots/, then add the paths to seo-baseline-allow.json to acknowledge."
              cat seo-report/seo-diff-violations.json
            fi
          fi

      - name: Fail the job if the report or tests failed
        if: always()
        run: |
          if [ "${{ steps.report.outcome }}" != "success" ] || [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "::error::SEO regression failed — inspect the 'seo-report' artifact."
            exit 1
          fi
