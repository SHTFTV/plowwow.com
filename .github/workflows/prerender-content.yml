name: Prerender Content

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prerender-content:
    name: Prerender content + JSON-LD + sitemap diff + Playwright crawl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun global store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock', 'bun.lockb') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Sitemap/robots diff vs baseline
        run: bunx tsx scripts/sitemap-diff.ts

      - name: Build (prerender + content validate + JSON-LD schema)
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Playwright crawl (JS-disabled, Googlebot UA)
        run: bunx tsx scripts/prerender-crawl.ts

      - name: Upload SEO reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerender-content-reports
          path: |
            seo-report/prerender-content.json
            seo-report/prerender-crawl.json
            seo-report/jsonld-schema.json
            seo-report/sitemap-diff.json
            seo-report/validation-report.md
