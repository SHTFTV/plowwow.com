name: Build Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-validate:
    name: Build + Validation Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Full production build wires prerender → build-validate → jsonld-preflight
      # → locale snapshot → redirect verifier. Any gate failure fails the job.
      - name: Production build (with all validators)
        id: build
        run: bun run build
        continue-on-error: true

      - name: Run build-validate standalone (guarantees report exists)
        if: always()
        run: bunx tsx scripts/build-validate.ts
        continue-on-error: true

      - name: Post validation report to job summary
        if: always()
        run: |
          {
            echo "## Build Validation"
            echo ""
            if [ -f seo-report/validation-report.md ]; then
              cat seo-report/validation-report.md
            else
              echo "_No validation-report.md produced — build likely failed before validators ran._"
            fi
            echo ""
            echo "### JSON-LD preflight"
            if [ -f /mnt/documents/jsonld-preflight.json ]; then
              node -e "const r=require('/mnt/documents/jsonld-preflight.json');console.log('- Pages: **'+r.pages+'**');console.log('- JSON-LD blocks: **'+r.blocks+'**');console.log('- Findings: **'+r.findings.length+'**');"
            fi
            echo ""
            echo "### Locale snapshot"
            if [ -f seo-report/jsonld-locale-snapshot.json ]; then
              node -e "const r=require('./seo-report/jsonld-locale-snapshot.json');console.log('- Routes: **'+Object.keys(r.routes).length+'**');console.log('- Locales: \`'+r.locales.join(', ')+'\`');console.log('- Issues: **'+r.issues.length+'**');"
            fi
            echo ""
            echo "### Redirects"
            if [ -f seo-report/redirects.json ]; then
              node -e "const r=require('./seo-report/redirects.json');const f=r.checks.filter(c=>c.status==='fail').length;const ok=r.checks.filter(c=>c.status==='ok').length;console.log('- OK: **'+ok+'**');console.log('- Failed: **'+f+'**');"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment validation summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'seo-report/validation-report.md';
            if (!fs.existsSync(path)) return;
            const body = '<!-- build-validate -->\n' + fs.readFileSync(path, 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.startsWith('<!-- build-validate -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-validate-report
          path: |
            seo-report/validation-report.json
            seo-report/validation-report.md
            seo-report/build-smoke.json
            seo-report/jsonld-locale-snapshot.json
            seo-report/redirects.json
          retention-days: 14
          if-no-files-found: warn

      - name: Fail job if build or validators failed
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "::error::Build (or one of the validators) failed — see the validation-report artifact."
            exit 1
          fi
