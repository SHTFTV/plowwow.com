name: Build Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-validate:
    name: Build + Validation Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate thresholds config (fail fast on bad max/severity)
        run: bun run seo:thresholds-validate


      # Full production build wires prerender → build-validate → jsonld-preflight
      # → locale snapshot → redirect verifier. Any gate failure fails the job.
      - name: Production build (with all validators)
        id: build
        run: bun run build
        continue-on-error: true

      - name: Run build-validate standalone (guarantees report exists)
        if: always()
        run: bunx tsx scripts/build-validate.ts
        continue-on-error: true

      - name: Post validation report to job summary
        if: always()
        run: |
          {
            echo "## Build Validation"
            echo ""
            if [ -f seo-report/validation-report.md ]; then
              cat seo-report/validation-report.md
            else
              echo "_No validation-report.md produced — build likely failed before validators ran._"
            fi
            echo ""
            echo "### JSON-LD preflight"
            if [ -f /mnt/documents/jsonld-preflight.json ]; then
              node -e "const r=require('/mnt/documents/jsonld-preflight.json');console.log('- Pages: **'+r.pages+'**');console.log('- JSON-LD blocks: **'+r.blocks+'**');console.log('- Findings: **'+r.findings.length+'**');"
            fi
            echo ""
            echo "### Locale snapshot"
            if [ -f seo-report/jsonld-locale-snapshot.json ]; then
              node -e "const r=require('./seo-report/jsonld-locale-snapshot.json');console.log('- Routes: **'+Object.keys(r.routes).length+'**');console.log('- Locales: \`'+r.locales.join(', ')+'\`');console.log('- Issues: **'+r.issues.length+'**');"
            fi
            echo ""
            echo "### Redirects"
            if [ -f seo-report/redirects.json ]; then
              node -e "const r=require('./seo-report/redirects.json');const f=r.checks.filter(c=>c.status==='fail').length;const ok=r.checks.filter(c=>c.status==='ok').length;console.log('- OK: **'+ok+'**');console.log('- Failed: **'+f+'**');"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cross-validator summary → step summary + pr-comment.md
        if: always()
        run: |
          bunx tsx scripts/validator-summary.ts | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Comment validation summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'seo-report/pr-comment.md';
            const fallback = 'seo-report/validation-report.md';
            const path = fs.existsSync(summaryPath) ? summaryPath : (fs.existsSync(fallback) ? fallback : null);
            if (!path) return;
            const raw = fs.readFileSync(path, 'utf8');
            const body = raw.startsWith('<!-- validator-summary -->') || raw.startsWith('<!-- build-validate -->')
              ? raw
              : '<!-- validator-summary -->\n' + raw;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.startsWith('<!-- validator-summary -->') || c.body?.startsWith('<!-- build-validate -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

      - name: Upload validation report (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            seo-report/validation-report.json
            seo-report/validation-report.md
            seo-report/pr-comment.md
          retention-days: 30
          if-no-files-found: warn

      - name: Upload all SEO report artifacts (JSON + Markdown)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: |
            seo-report/**/*.json
            seo-report/**/*.md
          retention-days: 14
          if-no-files-found: warn

      - name: Install Playwright browser (Chromium)
        if: always() && steps.build.outcome == 'success'
        run: bunx playwright install --with-deps chromium

      - name: Post-build hydration check (OG/Twitter + canonical + hreflang)
        if: always() && steps.build.outcome == 'success'
        run: bunx tsx scripts/hydration-check.ts
        continue-on-error: true

      - name: Post-build robots.txt + sitemap index public fetch
        if: always() && steps.build.outcome == 'success'
        run: bunx tsx scripts/robots-sitemap-fetch.ts
        continue-on-error: true

      - name: Emit GitHub Actions annotations for top failures
        if: always()
        run: bunx tsx scripts/gh-annotations.ts
        continue-on-error: true

      - name: Assemble repro bundle (hydration sample + config + reports)
        if: always()
        run: bunx tsx scripts/bundle-repro.ts
        continue-on-error: true

      - name: Upload repro bundle (zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-bundle
          path: seo-report/repro-bundle.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Upload annotation-skipped.json (per-category cap counts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annotation-skipped
          path: seo-report/annotation-skipped.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload annotation-plan.json (planned vs skipped details)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annotation-plan
          path: seo-report/annotation-plan.json
          retention-days: 30
          if-no-files-found: warn


      - name: Upload validation-report.html (standalone, no unzip needed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-html
          path: seo-report/validation-report.html
          retention-days: 30
          if-no-files-found: warn

      - name: Fail job if build or validators failed
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "::error::Build (or one of the validators) failed — see the validation-report artifact."
            exit 1
          fi
